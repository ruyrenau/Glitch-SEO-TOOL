name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests (Vitest + SQLite)
        run: pnpm test

      - name: Log pipeline benchmark (1M lines, 128 MB heap cap)
        run: NODE_OPTIONS=--max-old-space-size=128 pnpm bench:logs 1000000

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          PW_CHANNEL: chromium

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/

  wordpress-real:
    # Runs the WordPress test suite against a real WordPress (WordPress Playground, no Docker).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Start WordPress Playground
        run: |
          nohup pnpm wp:local > wp.log 2>&1 &
          for i in $(seq 1 60); do grep -q "application password" wp.log && break; sleep 5; done
          grep "application password" wp.log
      - name: WordPress suite against real WordPress
        run: |
          export WP_TEST_APP_PASSWORD=$(grep -oE "application password: \S+" wp.log | awk '{print $3}')
          WP_TEST_URL=http://127.0.0.1:8881 WP_TEST_USER=admin pnpm vitest run apps/api/test/wordpress.test.ts
