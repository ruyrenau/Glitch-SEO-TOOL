version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: glitch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: glitch_seo_ops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: glitch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: glitch-api
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/glitch_seo_ops?schema=public"
      REDIS_URL: "redis://redis:6379"
      PORT: 4000
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: glitch-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
