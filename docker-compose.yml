# Local stack: API (SQLite on a volume) + web.
# Postgres and Redis return when the BullMQ worker lands (see README roadmap).
services:
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "file:/data/glitch.db"
      HOST: "0.0.0.0"
      PORT: 4000
      NODE_ENV: production
      DEMO_MODE: "false"
      WEB_ORIGIN: "http://localhost:3000"
      SALT_SECRET: "${SALT_SECRET:-change-me-in-.env}"
    ports:
      - "4000:4000"
    volumes:
      - glitchdata:/data

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  glitchdata:
